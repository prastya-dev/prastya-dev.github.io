<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Drag & Drop Board</title>
  <link rel="manifest" href="manifest.json">
  <meta name="theme-color" content="#27ae60" />
  <style>
    body {
      font-family: Arial, sans-serif;
      background-color: #ecf0f1;
      margin: 0;
      padding: 20px;
    }
    h1 {
      text-align: center;
      margin-bottom: 40px;
    }
    .board {
      display: flex;
      gap: 20px;
      overflow-x: auto;
      padding-bottom: 10px;
      scrollbar-width: none;
      scroll-behavior: smooth;
    }
    .board::-webkit-scrollbar {
      display: none;
    }
    .column {
      background-color: #d6eaf8;
      border-radius: 16px;
      padding: 20px;
      min-width: 250px;
      flex: 0 0 auto;
    }
    .column h2 {
      text-align: center;
    }
    .card {
      background-color: white;
      border-radius: 12px;
      padding: 10px;
      margin-bottom: 10px;
      box-shadow: 0 2px 6px rgba(0,0,0,0.1);
      user-select: none;
    }
    .add-btn {
      background-color: #27ae60;
      color: white;
      border: none;
      border-radius: 50%;
      width: 40px;
      height: 40px;
      font-size: 24px;
      display: block;
      margin: 10px auto 0;
      cursor: pointer;
    }
  </style>
</head>
<body>

  <h1>Task Management</h1>

  <div class="board">
    <div class="column">
      <h2>Task</h2>
      <div id="task-cards">
        <div class="card">KB3407 -65.000 (tdk ada orang)</div>
        <div class="card">KB1999 -55.000 (hub tdk bisa)</div>
      </div>
      <button class="add-btn" onclick="addCard('task-cards')">+</button>
    </div>

    <div class="column">
      <h2>Pending</h2>
      <div id="pending-cards"></div>
      <button class="add-btn" onclick="addCard('pending-cards')">+</button>
    </div>

    <div class="column">
      <h2>Finish</h2>
      <div id="finish-cards"></div>
      <button class="add-btn" onclick="addCard('finish-cards')">+</button>
    </div>
  </div>

  <script src="https://cdnjs.cloudflare.com/ajax/libs/Sortable/1.15.0/Sortable.min.js"></script>
  <script>
    function addCard(columnId) {
      const cardText = prompt("Masukkan isi tugas:");
      if (cardText) {
        const card = document.createElement("div");
        card.className = "card";
        card.textContent = cardText;
        document.getElementById(columnId).appendChild(card);
      }
    }

    ['task', 'pending', 'finish'].forEach(id => {
      new Sortable(document.getElementById(id + '-cards'), {
        group: 'shared',
        animation: 150,
        onStart: () => {
          document.querySelector('.board').style.scrollBehavior = 'auto';
        },
        onEnd: () => {
          document.querySelector('.board').style.scrollBehavior = 'smooth';
        }
      });
    });

    if ('serviceWorker' in navigator) {
      navigator.serviceWorker.register('sw.js')
        .then(reg => console.log('Service Worker registered:', reg.scope))
        .catch(err => console.error('Service Worker registration failed:', err));
    }
  </script>
</body>
</html>
